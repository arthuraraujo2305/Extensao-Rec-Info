name: recinfo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch apenas para CPU (bem menor que a versão com CUDA)
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - sentence-transformers>=3.0
      - numpy
      - pandas
      - pyarrow
      - streamlit>=1.67
      - kagglehub
      - matplotlib
      - jupyterlab
      - ipykernel
      - nbformat
      - nbconvert
      - pytest
